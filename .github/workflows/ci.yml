name: CI

# Rulează la fiecare push și pull request către main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EventPass.slnx

      - name: Build
        run: dotnet build EventPass.slnx --no-restore --configuration Release

      # Testele + măsurarea acoperirii (ce linii din cod au fost rulate de teste)
      - name: Test
        run: dotnet test EventPass.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage

      # Raportul de acoperire: rezumat pe pagina rulării (Summary) + raport HTML descărcabil.
      # Excludem codul generat automat (migrări EF, cod generat de .NET), care nu se testează.
      - name: Coverage report
        if: always()
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report \
            -reporttypes:"MarkdownSummaryGithub;HtmlInline" "-classfilters:-System.*;-Microsoft.*;-EventPass.Server.Data.Migrations.*"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eventpass.client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eventpass.client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
