name: CI

# Rulează la fiecare push și pull request către main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EventPass.slnx

      - name: Build
        run: dotnet build EventPass.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test EventPass.slnx --no-build --configuration Release

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eventpass.client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eventpass.client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
