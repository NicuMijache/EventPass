<section class="container auth">
  <div class="auth__intro">
    <h1 class="display">Intră în cont</h1>
    <p class="auth__lead">Ai nevoie de cont ca să cumperi bilete și să le găsești oricând în „Comenzile mele”.</p>
  </div>

  <form class="auth__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (expired()) {
      <p class="form-note">Sesiunea a expirat. Intră din nou în cont.</p>
    }
    @if (error(); as message) {
      <p class="form-alert" role="alert">{{ message }}</p>
    }

    <label class="field">
      <span class="field__label">Email</span>
      <input class="field__input" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__error">Introdu o adresă de email validă.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Parolă</span>
      <input class="field__input" type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">Introdu parola.</span>
      }
    </label>

    <button class="btn btn--wide" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Se verifică…' : 'Intră în cont' }}
    </button>

    <p class="auth__switch">
      Nu ai cont?
      <a routerLink="/cont-nou" [queryParams]="returnUrl() ? { returnUrl: returnUrl() } : {}">Creează unul</a>
    </p>
  </form>
</section>
